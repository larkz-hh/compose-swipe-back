name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USE_CN_MIRROR: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Lint
        run: ./gradlew :library:lint

      - name: Assemble
        run: ./gradlew :library:assembleDebug

      - name: Unit tests
        run: ./gradlew :library:testDebugUnitTest

      - name: Sample
        run: ./gradlew :app:assembleDebug

      - name: Publish to local Maven
        run: ./gradlew :library:publishToMavenLocal